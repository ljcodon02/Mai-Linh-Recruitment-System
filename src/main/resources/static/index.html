<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ thống Tuyển dụng Mai Linh </title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 40px; }
        .form-container { background: white; padding: 30px; max-width: 500px; margin: auto; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { color: #28a745; text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; }
        input[type="text"], select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }

        /* Style cho các ô Checkbox */
        .checkbox-group { display: flex; align-items: center; gap: 10px; background: #f9f9f9; padding: 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #eee; }
        .checkbox-group input { width: 18px; height: 18px; cursor: pointer; }

        button { width: 100%; padding: 14px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #218838; }
        #thongBao { margin-top: 20px; text-align: center; font-weight: bold; }
        .section-title { font-size: 14px; color: #666; margin-top: 20px; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>ĐƠN ĐĂNG KÝ LÁI XE </h2>

    <div class="input-group">
        <label>Họ và tên ứng viên</label>
        <input type="text" id="hoTen" placeholder="Nguyễn Văn A">
    </div>

    <div class="input-group">
        <label>Số CCCD</label>
        <input type="text" id="soCCCD" placeholder="00120xxxxxxx">
    </div>

    <div class="input-group">
        <label>Loại bằng lái</label>
        <select id="loaiBangLai">
            <option value="B2">Hạng B2</option>
            <option value="C">Hạng C</option>
            <option value="D">Hạng D</option>
        </select>
    </div>

    <div class="section-title">Thông tin bổ sung (Dành cho lái xe tái ký)</div>

    <div class="checkbox-group">
        <input type="checkbox" id="trangThaiTaiKy">
        <label for="trangThaiTaiKy">Là lái xe tái ký (đã từng làm tại Mai Linh)</label>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="noCongNo">
        <label for="noCongNo">Còn nợ công nợ cũ</label>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="viPhamNhanThan">
        <label for="viPhamNhanThan">Có vi phạm nhân thân/tiền án</label>
    </div>

    <button onclick="nopHoSo()">GỬI HỒ SƠ ĐĂNG KÝ</button>
    <p id="thongBao"></p>
</div>

<script>
    async function nopHoSo() {
        // Thu thập dữ liệu từ tất cả các ô (bao gồm cả các ô checkbox)
        const data = {
            hoTen: document.getElementById('hoTen').value,
            soCCCD: document.getElementById('soCCCD').value,
            loaiBangLai: document.getElementById('loaiBangLai').value,
            trangThaiTaiKy: document.getElementById('trangThaiTaiKy').checked,
            noCongNo: document.getElementById('noCongNo').checked,
            viPhamNhanThan: document.getElementById('viPhamNhanThan').checked,
            datSucKhoe: true // Mặc định là đạt sức khỏe để đi tiếp bước sau
        };

        if(!data.hoTen || !data.soCCCD) {
            alert("Vui lòng điền đầy đủ Họ tên và CCCD!");
            return;
        }

        try {
            const response = await fetch('http://localhost:9090/api/recruitment/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.text();
            const messageElement = document.getElementById('thongBao');
            messageElement.innerText = "Hệ thống phản hồi: " + result;

            // Đổi màu thông báo dựa trên kết quả
            messageElement.style.color = result.includes("loại") ? "red" : "green";

        } catch (error) {
            document.getElementById('thongBao').innerText = "Lỗi: Không kết nối được với Server!";
            document.getElementById('thongBao').style.color = "orange";
        }
    }
</script>

</body>
</html>
